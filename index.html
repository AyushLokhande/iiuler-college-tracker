<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#080a0e">
  <meta name="description" content="A clean student dashboard for attendance, timetable, calendar and mess menu.">
  <title>IIULER | Student Dashboard</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="cloudLogin" style="
    max-width:420px;
    margin:12vh auto;
    padding:24px;
    color:#f5f7fa;
    background:#11141a;
    border:1px solid #222731;
    border-radius:20px;
    font-family:system-ui,sans-serif;
  ">
    <h2 style="margin-top:0">IIULER · GOA</h2>
    <p style="color:#858c98">Sign in to sync attendance and mess updates.</p>

    <form id="cloudLoginForm">
      <input id="cloudEmail" type="email" placeholder="Email"
        autocomplete="username" required
        style="display:block;width:100%;box-sizing:border-box;margin:12px 0;padding:13px;border-radius:10px;border:1px solid #333;background:#080a0e;color:white;">

      <input id="cloudPassword" type="password" placeholder="Password"
        autocomplete="current-password" required
        style="display:block;width:100%;box-sizing:border-box;margin:12px 0;padding:13px;border-radius:10px;border:1px solid #333;background:#080a0e;color:white;">

      <button type="submit"
        style="width:100%;padding:13px;border-radius:10px;background:#347dff;color:white;font-weight:700;">
        Sign in
      </button>
    </form>

    <p id="cloudLoginStatus" role="status"
      style="color:#a7afbb;font-size:13px"></p>
  </div>

  <div class="app" style="display:none">

    <header class="header">
      <div>
        <div class="college-name">IIULER · GOA</div>
        <h1 id="pageTitle">Attendance</h1>
      </div>
      <button class="today-button" onclick="goToday()">Today</button>
    </header>

    <main>
      <section id="attendancePage" class="page active"></section>
      <section id="calendarPage" class="page"></section>
      <section id="messPage" class="page"></section>
    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-button active" id="navAttendance" onclick="changePage('attendance')">
        <span class="nav-icon">◉</span><span>Attendance</span>
      </button>
      <button class="nav-button" id="navCalendar" onclick="changePage('calendar')">
        <span class="nav-icon">▦</span><span>Calendar</span>
      </button>
      <button class="nav-button" id="navMess" onclick="changePage('mess')">
        <span class="nav-icon">☷</span><span>Mess</span>
      </button>
    </nav>
  </div>

  <div id="modal"></div>


  <!-- Libraries: load each one only once -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
